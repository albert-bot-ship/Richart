/* ---------- 工具 ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s).replace(/[\uff01-\uff5e]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0);}).replace(/\u3000/g,' ').toLowerCase().replace(/臺/g,'台').replace(/[\s\-–・·．.()（）]/g,'');}
function stripEx(s){return String(s).replace(/[(（]不含[^)）]*[)）]/g,'');}
function fmt(n){return (Math.round(n*10)/10).toString();}
function plan(id){if(id==='base')return BASE;for(var i=0;i<PLANS.length;i++)if(PLANS[i].id===id)return PLANS[i];return null;}
function rateOf(p,r){return (p.fixed||state.level===2)?r:1.3;}
function maxOf(p){return state.level===2?p.max:1.3;}
function parseD(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function dstr(s){var d=parseD(s);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();}
function hl(text,tq){
  text=String(text);
  if(!tq||!tq.length) return esc(text);
  var sep='[\\s\\-–・·．.()（）]*', skip=[], rg=[];
  text.replace(/[(（]不含[^)）]*[)）]/g,function(m,off){skip.push([off,off+m.length]);return m;});
  tq.forEach(function(t){
    if(!t) return;
    var pat=Array.prototype.map.call(t,function(ch){
      if(ch==='台') return '[台臺]';
      if(/[a-z0-9]/.test(ch)) return '['+ch+ch.toUpperCase()+String.fromCharCode(ch.charCodeAt(0)+0xfee0)+String.fromCharCode(ch.toUpperCase().charCodeAt(0)+0xfee0)+']';
      return ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }).join(sep);
    try{var re=new RegExp(pat,'g'),m;
      while((m=re.exec(text))){ if(!m[0].length){re.lastIndex++;continue;}
        var a=m.index,b=a+m[0].length;
        if(!skip.some(function(x){return a<x[1]&&b>x[0];})) rg.push([a,b]); }
    }catch(err){}
  });
  if(!rg.length) return esc(text);
  rg.sort(function(x,y){return x[0]-y[0];});
  var mg=[rg[0].slice()];
  rg.slice(1).forEach(function(r){var l=mg[mg.length-1];if(r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else mg.push(r.slice());});
  var out='',pos=0;
  mg.forEach(function(r){out+=esc(text.slice(pos,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';pos=r[1];});
  return out+esc(text.slice(pos));
}
function status(p){
  var now=new Date(), s=parseD(p.period[0]), e=parseD(p.period[1]), end=new Date(e.getTime()+864e5);
  var left=Math.ceil((end-now)/864e5);
  if(now<s) return {k:'neutral',bar:'',t:'尚未開始',pct:0,left:left};
  if(now>=end) return {k:'danger',bar:'over',t:'已結束',pct:100,left:0};
  var pct=Math.max(0,Math.min(100,(now-s)/(end-s)*100));
  if(left<=60) return {k:'warn',bar:'soon',t:'剩 '+left+' 天',pct:pct,left:left,soon:true};
  return {k:'ok',bar:'',t:'進行中',pct:pct,left:left};
}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},1800);}

/* ---------- 自動主題：日出日落 ---------- */
function sunEvent(date,lat,lng,rising){
  var D=Math.PI/180,z=90.833;
  var y=date.getFullYear(),m=date.getMonth(),d=date.getDate();
  var N=Math.round((Date.UTC(y,m,d)-Date.UTC(y,0,1))/864e5)+1;
  var lh=lng/15,t=N+((rising?6:18)-lh)/24;
  var M=0.9856*t-3.289;
  var Ls=(M+1.916*Math.sin(M*D)+0.020*Math.sin(2*M*D)+282.634+720)%360;
  var RA=(Math.atan(0.91764*Math.tan(Ls*D))/D+720)%360;
  RA=(RA+(Math.floor(Ls/90)*90-Math.floor(RA/90)*90))/15;
  var sd=0.39782*Math.sin(Ls*D),cd=Math.cos(Math.asin(sd));
  var cH=(Math.cos(z*D)-sd*Math.sin(lat*D))/(cd*Math.cos(lat*D));
  if(cH>1||cH<-1) return null;
  var H=(rising?360-Math.acos(cH)/D:Math.acos(cH)/D)/15;
  var UT=((H+RA-0.06571*t-6.622-lh)%24+24)%24;
  var mid=new Date(y,m,d).getTime(), r=Date.UTC(y,m,d)+UT*3600e3;
  while(r<mid) r+=864e5; while(r>=mid+864e5) r-=864e5;
  return new Date(r);
}
function sunToday(){
  var loc=state.geo||TAICHUNG,now=new Date();
  return {rise:sunEvent(now,loc.lat,loc.lng,true),set:sunEvent(now,loc.lat,loc.lng,false),src:state.geo?'目前定位':'台中'};
}
function isDay(){var s=sunToday(),n=new Date();if(!s.rise||!s.set){var h=n.getHours();return h>=6&&h<18;}return n>=s.rise&&n<s.set;}
function hm(d){return d?('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2):'--:--';}
function resolvedTheme(){return state.theme==='auto'?(isDay()?'light':'dark'):state.theme;}
function applyTheme(){
  var t=resolvedTheme();
  if(document.documentElement.getAttribute('data-theme')!==t) document.documentElement.setAttribute('data-theme',t);
}
function requestGeo(force){
  if(!('geolocation' in navigator)) return;
  if(!force&&state.geo&&Date.now()-state.geo.t<864e5) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    state.geo={lat:pos.coords.latitude,lng:pos.coords.longitude,t:Date.now()};
    store.set('geo',state.geo);applyTheme();
    if(sheetMode==='settings') renderSettings();
  },function(){},{timeout:10000,maximumAge:6*3600e3});
}

var tiltOn=false,tiltRAF=0,tiltXY=null;
function setGlint(el,x,y){el.style.setProperty('--mx',x.toFixed(1)+'%');el.style.setProperty('--my',y.toFixed(1)+'%');}
document.addEventListener('pointermove',function(ev){
  if(reduce||!ev.target.closest) return;
  var c=ev.target.closest('.card');if(!c) return;
  var r=c.getBoundingClientRect();
  setGlint(c,(ev.clientX-r.left)/r.width*100,(ev.clientY-r.top)/r.height*100);
},{passive:true});
document.addEventListener('pointerout',function(ev){
  if(!ev.target.closest) return;
  var c=ev.target.closest('.card');
  if(c&&!(ev.relatedTarget&&c.contains(ev.relatedTarget))){c.style.removeProperty('--mx');c.style.removeProperty('--my');}
});
function onOrient(e){
  if(e.gamma==null) return;
  var x=Math.max(-25,Math.min(25,e.gamma)),y=Math.max(10,Math.min(80,e.beta||45));
  tiltXY=[50+x*2,(y-10)/70*100];
  if(!tiltRAF) tiltRAF=requestAnimationFrame(function(){tiltRAF=0;setGlint(document.documentElement,tiltXY[0],tiltXY[1]);});
}
function enableTilt(gesture){
  var D=window.DeviceOrientationEvent;
  if(reduce||!D) return Promise.resolve(false);
  var p;
  if(typeof D.requestPermission==='function'){
    if(!gesture) return Promise.resolve(false);
    try{p=D.requestPermission();}catch(e){return Promise.resolve(false);}
  }else p=Promise.resolve('granted');
  return p.then(function(r){
    if(r!=='granted') return false;
    if(!tiltOn){window.addEventListener('deviceorientation',onOrient);tiltOn=true;}
    return true;
  },function(){return false;});
}
function disableTilt(){
  window.removeEventListener('deviceorientation',onOrient);tiltOn=false;
  document.documentElement.style.removeProperty('--mx');document.documentElement.style.removeProperty('--my');
}

  return best;
}
function railGo(rail,i,smooth){
  var s=$$('.slide',rail)[i];if(!s) return;
  var left=s.offsetLeft-(rail.clientWidth-s.offsetWidth)/2;
  if(smooth&&!reduce&&rail.scrollTo) rail.scrollTo({left:left,behavior:'smooth'}); else rail.scrollLeft=left;
}
function railBind(rail,onChange){

  rail.addEventListener('scroll',function(){clearTimeout(t);t=setTimeout(function(){var i=railIndex(rail);if(i!==last){last=i;onChange(i);}},90);},{passive:true});

}

/* 比對方式：text 名稱、syn 同義詞、alias 別名、group 類別 */
function matchHow(e,tq){
  if(!tq.length) return null;
  if(e.key.indexOf(tq[0])>-1) return 'text';
  for(var i=1;i<tq.length;i++) if(e.key.indexOf(tq[i])>-1) return 'syn';
  for(var j=0;j<e.alias.length;j++) if(e.alias[j].indexOf(tq[0])>-1) return 'alias';
  for(var k=0;k<tq.length;k++) if(e.gkey.indexOf(tq[k])>-1) return 'group';
  return null;
}

/* 官方注意事項「回饋方式」：正附卡交易採逐筆(小數點後無條件捨去)計算台新Point(信用卡)回饋 */
function rawPts(n,rate){return Math.round(n*rate*100)/10000;}

  var n=ntd(); if(!n) return '<span class="pt-hint">匯率取得中，暫無法換算</span>';

    if(fee){var f=n*fee/100;s+='<span class="pt-x">手續費 NT$'+n1(f)+'・淨回饋約 <b>'+n1(pts-f)+'</b></span>';}

function updateAmts(){

function loadFx(force){
  if(!fxOn()||FX.loading) return;
  if(!force&&FX.rates&&Date.now()-FX.t<6*3600e3) return;
  if(!window.fetch){FX.err=true;renderFxLine();return;}
  FX.loading=true;FX.err=false;renderFxLine();
  fetch(FX_API).then(function(r){return r.json();}).then(function(d){
    if(!d||d.result!=='success'||!d.rates) throw new Error('fx');
    FX={t:Date.now(),upd:(d.time_last_update_unix||0)*1000,rates:d.rates};store.set('fx',FX);
    refreshCalc();
  }).catch(function(){FX.loading=false;FX.err=true;refreshCalc();});
}

/* ---------- 支付方式與「怎麼來的」 ---------- */
var NOTE_ALIAS={'訂房旅行':'訂房平台'};
function notesFor(e){
  var p=e.p,it=norm(stripEx(e.item)),gt=norm(e.g.t),pn=norm(p.name);
  return p.notes.filter(function(n){
    if(norm(n.h)===pn) return true;
    var toks=(NOTE_ALIAS[n.h]||n.h).split(/[、\/]/).map(norm);
    return toks.some(function(t){
      if(!t) return false;
      return t===it||t===gt||(t.length>=2&&it.indexOf(t)>-1)||(gt.indexOf(t)>-1&&gt.indexOf(t+'+')<0);
    });
  });
}
var PAY_RE=/Pay|實體卡|支付|綁定|刷卡|錢包/;
function payOf(e){
  if(e.p.fixed) return null;
  var txt=e.g.cond||(e.g.t.indexOf('LINE Pay 及 全盈+Pay')===0?'LINE Pay 及 全盈+Pay綁定支付':e.p.pay);
  var lim=notesFor(e).filter(function(n){return PAY_RE.test(n.t);});
  return {txt:txt,lim:lim};
}
function payHTML(e){
  var pay=payOf(e); if(!pay) return '';
  return '<div class="pay-box"><div class="pay-h">結帳可用付款方式</div><p>'+esc(pay.txt)+'</p>'+
    pay.lim.map(function(n){return '<p class="pay-lim"><b>'+esc(n.h)+'</b>'+esc(n.t)+'</p>';}).join('')+
    '<div class="pay-src">依據：台新銀行 Richart卡活動頁「'+esc(e.p.name)+'」支付方式及注意事項</div></div>';
}
function whyHTML(e,rate){
  var p=e.p,pay=payOf(e),shown=pay?pay.lim:[];
  var notes=notesFor(e).filter(function(n){return shown.indexOf(n)<0;});
  var rows=[['方案',(p.fixed?'免切換':p.name)+'（'+dstr(p.period[0])+'–'+dstr(p.period[1])+'）'],['類別',e.g.t+'　'+fmt(e.g.r)+'%'],['通路',e.item]];
  if(!p.fixed) rows.push(['等級',state.level===2?'LEVEL 2：依方案回饋率':'LEVEL 1：切換刷加碼通路最高1.3%']);
  if(e.tag) rows.push(['條件',e.tag]);
  return '<details class="why"><summary>這個數字怎麼來的？</summary><dl>'+
    rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>'+
    (e.g.extra?'<p class="q">'+esc(e.g.extra)+'</p>':'')+
    (notes.length?'<div class="q-h">官方注意事項</div>'+notes.map(function(n){return '<p class="q"><b>'+esc(n.h)+'</b>'+esc(n.t)+'</p>';}).join(''):'')+
    '<a href="'+SRC+'" target="_blank" rel="noopener">查看官方活動頁</a></details>';
}

/* ---------- 搜尋 ---------- */
function findRows(tq){
  var on=fxOn(),cat=state.cat,rows=[];
  ENTRIES.forEach(function(e){
    if(status(e.p).k==='danger') return;
    if(cat!=='all'&&e.c!==cat) return;
    var how=tq.length?matchHow(e,tq):null;
    if(tq.length&&!how) return;
    if(!tq.length&&cat==='all') return;
    rows.push(mk(e,{how:how,rate:rateOf(e.p,e.g.r),na:naOf(e),fee:feeRate(e)}));
  });
  if(on&&OVERSEAS&&status(OVERSEAS.p).k!=='danger'&&!rows.some(function(r){return r.p.id==='travel'&&r.item==='海外消費';}))
    rows.push(mk(OVERSEAS,{how:null,rate:rateOf(OVERSEAS.p,OVERSEAS.g.r),na:false,fee:feeRate(OVERSEAS),viaFx:true,tag:'外幣交易視為海外消費'}));
  rows.sort(function(a,b){return ((a.na?1:0)-(b.na?1:0))||(b.rate-a.rate)||PLANS.indexOf(a.p)-PLANS.indexOf(b.p);});
  return rows;
}
function rowTags(e){
  var t='';
  if(e.how&&e.how!=='text') t+='<span class="tag">'+HOW_TXT[e.how]+'</span>';
  if(e.na) t+='<span class="tag danger">'+e.na+'</span>';
  if(e.tag) t+='<span class="tag warn">'+esc(e.tag)+'</span>';
  var st=status(e.p);
  if(st.soon) t+='<span class="tag warn">'+esc(st.t)+'</span>';
  if(st.k==='danger') t+='<span class="tag danger">已結束</span>';
  return t?'<div class="res-tags">'+t+'</div>':'';
}
function mainLine(rows){
  if(!state.main) return '<div class="today-line"><span>尚未設定今日主卡</span><button class="linkbtn" data-act="pickmain">設定</button></div>';

  if(hit.length){rate=hit[0].rate;txt='此通路 <b>'+fmt(rate)+'%</b>（'+esc(hit[0].item)+'）';}
  else if(p.id==='holiday'){rate=rateOf(p,2);txt='國內節假日不限通路 <b>'+fmt(rate)+'%</b>'+(fxOn()?'（海外消費是否適用，請以官方公告為準）':'');}
  else{rate=0.3;txt='非「'+esc(p.name)+'」指定通路，以一般消費 <b>0.3%</b> 計算';}
  return '<div class="today-line"><span class="swatch" style="--g:'+p.g+'"></span><span class="tl-main">今日主卡「'+esc(p.name)+'」：'+txt+'<small class="amt" data-rate="'+rate+'"></small></span><button class="linkbtn" data-act="pickmain">更改</button></div>';
}

    porder.forEach(function(pid){
      var p=plan(pid),st=status(p);
      h+='<div class="panel"><div class="res-plan-head"><span class="swatch" style="--g:'+p.g+'"></span><b>'+esc(p.fixed?'免切換':p.name)+'</b><span class="tag '+st.k+'">'+esc(st.t)+'</span></div>';

    if(status(p).k==='danger') return;

  });
  list.sort(function(x,y){return (on?y.net-x.net:y.pts-x.pts)||(y.b.rate-x.b.rate)||PLANS.indexOf(x.p)-PLANS.indexOf(y.p);});
  var h='';

    if(on&&!x.fr&&b.e) tags+='<span class="tag ok">免國外交易手續費</span>';
    var sub=b.base?'非指定通路，以一般消費 0.3% 計算':(b.hol?'節假日不限通路(含保費)消費':esc(b.e.item)+'・'+esc(b.e.g.t));
    h+='<div class="panel c-row'+(i===0&&n?' vitrine':'')+'"><div class="c-head"><span class="swatch" style="--g:'+p.g+'"></span><div class="c-main"><b>'+esc(p.fixed?'免切換':p.name)+'</b><div class="res-sub">'+sub+'</div>'+(tags?'<div class="res-tags">'+tags+'</div>':'')+'</div><span class="rate-pill num">'+fmt(b.rate)+'<small>%</small></span></div>';

      h+='</dl>';
    }
    h+='</div>';
  });
  h+='<p class="src" style="margin-top:12px">回饋以台新Point(信用卡)計，依官方注意事項「回饋方式」逐筆(小數點後無條件捨去)計算；實際以台新銀行入帳為準。'+(on?'淨回饋以 1 點折合 NT$1 估算；國外交易手續費 1.5%，台新Pay+ 日韓交易依官方「免1.5%國外交易手續費」以 0 計。':'')+
     '<br>資料來源：<a href="'+SRC+'" target="_blank" rel="noopener">台新銀行 Richart卡活動頁</a>'+(on?'；匯率：<a href="'+FX_SITE+'" target="_blank" rel="noopener">ExchangeRate-API</a>':'')+'</p>';
  box.innerHTML=h;

  });
  if(p.notes.length){
    h+='<details class="notes"><summary>注意事項（'+p.notes.length+'）</summary><ul>'+p.notes.map(function(n){return '<li><b>'+esc(n.h)+'</b>'+esc(n.t)+'</li>';}).join('')+'</ul></details>';
  }
  h+='<div class="d-actions"><button class="btn" data-act="setmain" data-pid="'+p.id+'">'+(state.main===p.id?'已是今日主卡':'設為今日主卡')+'</button>'+
     '<span class="src">資料來源：<a href="'+SRC+'" target="_blank" rel="noopener">台新銀行官網</a></span></div></div>';
  return h;
}
var stackRO=null;
function walletBar(){
  return '<h2 class="sec-title">權益方案<span class="aside">8 張</span></h2>'+
    '<div class="w-bar"><span class="hint">'+(state.wmode==='rail'?'左右滑動換卡，點卡翻面':'點卡展開，再點翻面')+'</span>'+
    '<div class="seg" role="group" aria-label="排列方式">'+
     '<button data-act="wmode" data-v="stack" aria-pressed="'+(state.wmode==='stack')+'">堆疊</button>'+
     '<button data-act="wmode" data-v="rail" aria-pressed="'+(state.wmode==='rail')+'">輪播</button>'+
    '</div></div>';
}
var stackRO=null;
function renderWallet(){
  if(stackRO){stackRO.disconnect();stackRO=null;}
  if(state.wmode==='rail'){renderRail();return;}
  var h=walletBar()+'<div class="stack" id="stack">';
  PLANS.forEach(function(p){
    var on=state.open===p.id;
    h+='<div class="slot'+(on?' open':'')+'" data-pid="'+p.id+'">'+cardHTML(p,{act:'wcard',flipped:on&&state.flip,label:on?(state.flip?'，點擊翻回正面':'，點擊翻面查看完整內容'):'，點擊展開'})+
       '<div class="detail-wrap"'+(on&&state.flip?'':' hidden')+'>'+detailHTML(p)+'</div></div>';
  });
  h+='</div><p class="hint" style="margin-top:14px">一般消費享0.3% 台新Point(信用卡)回饋無上限；保費一次付清最高 1.3%（免切換）。</p>';
  $('#page-wallet').innerHTML=h;
  var stack=$('#stack');
  var size=function(){var w=stack.clientWidth;stack.style.setProperty('--cardh',(w/1.586)+'px');stack.style.setProperty('--peek',Math.round(w*0.17)+'px');};
  size();
  if(window.ResizeObserver){stackRO=new ResizeObserver(size);stackRO.observe(stack);}
}
function railLabel(p){return p.id===state.open?(state.flip?'，點擊翻回正面':'，點擊翻面'):'，點擊切換到此卡';}
function renderRail(){
  if(!state.open) state.open=PLANS[0].id;
  var cur=pidIndex(state.open);
  var h=walletBar()+'<div class="rail" id="walletRail">'+PLANS.map(function(p){
    return '<div class="slide">'+cardHTML(p,{act:'ccard',flipped:p.id===state.open&&state.flip,label:railLabel(p)})+'</div>';
  }).join('')+'</div>'+dotsHTML('walletDots',cur)+
  '<div id="railDetail">'+detailHTML(PLANS[cur])+'</div>'+
  '<p class="hint" style="margin-top:14px">一般消費享0.3% 台新Point(信用卡)回饋無上限；保費一次付清最高 1.3%（免切換）。</p>';
  $('#page-wallet').innerHTML=h;
  var rail=$('#walletRail');
  railGo(rail,cur,false);
  railBind(rail,function(i){
    if(PLANS[i].id===state.open) return;
    state.open=PLANS[i].id;state.flip=false;syncWallet();
  })(cur);
}
function syncWallet(){
  if(state.wmode==='rail'){
    var rail=$('#walletRail');if(!rail) return;
    var cur=pidIndex(state.open);
    $$('.card',rail).forEach(function(c){
      var p=plan(c.getAttribute('data-pid'));
      c.classList.toggle('flipped',p.id===state.open&&state.flip);
      c.setAttribute('aria-label',p.name+railLabel(p));
    });
    dotsSet('walletDots',cur);
    $('#railDetail').innerHTML=detailHTML(PLANS[cur]);
    if(railIndex(rail)!==cur) railGo(rail,cur,true);
    return;
  }
  $$('#page-wallet .slot').forEach(function(s){
    var on=s.getAttribute('data-pid')===state.open, card=$('.card',s);
    s.classList.toggle('open',on);
    card.classList.toggle('flipped',on&&state.flip);
    card.setAttribute('aria-label',plan(s.getAttribute('data-pid')).name+(on?(state.flip?'，點擊翻回正面':'，點擊翻面查看完整內容'):'，點擊展開'));
    $('.detail-wrap',s).hidden=!(on&&state.flip);
  });
  var cur2=$('#page-wallet .slot[data-pid="'+state.open+'"]');
  if(cur2) setTimeout(function(){cur2.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});},reduce?0:120);
}
function walletTap(pid){
  if(state.open!==pid){state.open=pid;state.flip=false;}else{state.flip=!state.flip;}
  syncWallet();
}

/* ---------- 收藏 ---------- */
function renderFavs(){
  var h='';
  if(state.qfavs.length) h+='<h2 class="sec-title">收藏的搜尋<span class="aside">'+state.qfavs.length+' 筆</span></h2>'+qfavChips();
  h+='<h2 class="sec-title">收藏<span class="aside">'+state.favs.length+' 家</span></h2>';
  if(!state.favs.length){
    h+='<div class="panel empty"><b>還沒有收藏</b>在搜尋結果點星號，把常去的店家收進來，這裡會列出每家最划算的方案；點搜尋標題旁的星號，可收藏整個搜尋。</div>';
    $('#page-favs').innerHTML=h;return;
  }
  state.favs.forEach(function(name){
    var rows=ENTRIES.filter(function(e){return e.item===name&&status(e.p).k!=='danger';}).map(function(e){return {e:e,r:rateOf(e.p,e.g.r)};});
    rows.sort(function(a,b){return b.r-a.r;});
    h+='<div class="panel'+(rows.length?' vitrine':'')+'"><div class="res-row" style="border-top:0;padding-top:0"><div class="res-main"><div class="res-name" style="font-size:16px">'+esc(name)+'</div>'+
       (rows.length?'<div class="res-sub">最佳：'+esc(rows[0].e.p.fixed?'免切換':rows[0].e.p.name)+'</div>':'<div class="res-sub">目前沒有進行中的方案</div>')+'</div>'+
       (rows.length?'<span class="rate-pill num">'+fmt(rows[0].r)+'<small>%</small></span>':'')+
       '<button class="star" data-act="fav" data-item="'+esc(name)+'" aria-pressed="true" aria-label="取消收藏 '+esc(name)+'">'+starIcon(true)+'</button></div>';
    rows.forEach(function(x){
      h+='<div class="res-row"><span class="swatch" style="--g:'+x.e.p.g+'"></span><div class="res-main"><div>'+esc(x.e.p.fixed?'免切換':x.e.p.name)+'</div><div class="res-sub">'+esc(x.e.g.t)+'</div>'+rowTags(x.e)+'</div><span class="num" style="font-weight:700">'+fmt(x.r)+'%</span></div>';
    });
    h+='</div>';
  });
  $('#page-favs').innerHTML=h;
}
function toggleFav(name){
  var i=state.favs.indexOf(name);
  if(i>-1) state.favs.splice(i,1); else state.favs.push(name);
  store.set('favs',state.favs);
  var on=i<0;
  $$('[data-act="fav"]').forEach(function(b){if(b.getAttribute('data-item')===name){b.setAttribute('aria-pressed',on);b.innerHTML=starIcon(on);}});
  toast(on?'已收藏「'+name+'」':'已取消收藏');
  if(state.tab==='favs') renderFavs();
}

/* ---------- 分頁 ---------- */
var TABS=[['home','首頁','home2'],['search','搜尋','search'],['calc','試算','calc'],['wallet','錢包','wallet'],['favs','收藏','star']];
function renderTabbar(){
  $('#tabbar').innerHTML=TABS.map(function(t){
    return '<button class="tab" data-act="tab" data-tab="'+t[0]+'"'+(state.tab===t[0]?' aria-current="page"':'')+'>'+icon(t[2])+'<span>'+t[1]+'</span></button>';
  }).join('');
}
function renderPage(t){({home:renderHome,search:renderSearch,calc:renderCalc,wallet:renderWallet,favs:renderFavs})[t]();}
function setTab(t,keepScroll){
  if(t==='home') state.hview=null;
  state.tab=t;renderTabbar();
  TABS.forEach(function(x){$('#page-'+x[0]).hidden=x[0]!==t;});
  renderPage(t);
  if(!keepScroll) window.scrollTo(0,0);
}
function setQuery(v){
  state.q=v;$('#q').value=v;$('#btnClear').hidden=!v;
  if(state.tab!=='search') setTab('search'); else renderSearch();
}
function setCat(c){
  state.cat=(state.cat===c&&c!=='all')?'all':c;renderChips();
  if(state.tab!=='search') setTab('search'); else {renderSearch();window.scrollTo(0,0);}
}

/* ---------- 底部面板 ---------- */
var sheetMode=null,lastFocus=null;
function openSheet(mode){
  sheetMode=mode;lastFocus=document.activeElement;
  if(mode==='settings') renderSettings(); else renderPick();
  var s=$('#sheet');s.hidden=false;
  s.setAttribute('aria-label',mode==='settings'?'設定':'選擇今日主卡');
  requestAnimationFrame(function(){requestAnimationFrame(function(){s.classList.add('open');$('#backdrop').classList.add('open');});});
  document.body.style.overflow='hidden';
  setTimeout(function(){var b=$('#sheet [data-act="close"]');if(b)b.focus();},50);
}
function closeSheet(){
  var s=$('#sheet');s.classList.remove('open');$('#backdrop').classList.remove('open');
  document.body.style.overflow='';sheetMode=null;
  setTimeout(function(){if(!s.classList.contains('open'))s.hidden=true;},reduce?0:400);
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
function sheetHead(title){return '<div class="sheet-head"><h2>'+title+'</h2><button class="icon-btn" data-act="close" aria-label="關閉">'+icon('close')+'</button></div>';}
function renderSettings(){
  var s=sunToday(),themes=[['auto','自動','依日出日落切換'],['light','淺色','明亮清爽'],['dark','深色','夜間藍紫光暈'],['luxe','典藏','香檳金與絲絨黑']];
  var h=sheetHead('設定');
  h+='<div class="set-group"><div class="set-label">外觀主題</div><div class="theme-grid">'+themes.map(function(t){
    return '<button class="opt" data-act="theme" data-v="'+t[0]+'" aria-pressed="'+(state.theme===t[0])+'"><span class="pv '+t[0]+'"></span><span><b>'+t[1]+'</b><small>'+t[2]+'</small></span></button>';
  }).join('')+'</div>';
  if(state.theme==='auto') h+='<p class="hint" style="margin-top:8px">依'+s.src+'計算：日出 '+hm(s.rise)+'、日落 '+hm(s.set)+'，現在為'+(isDay()?'白天（淺色）':'夜間（深色）')+'</p>';
  h+='</div>';
  h+='<div class="set-group"><div class="set-label">卡友身分（影響回饋計算）</div><div class="lvl">'+
    '<button class="opt" data-act="level" data-v="1" aria-pressed="'+(state.level===1)+'"><span><b>LEVEL 1　1.3%</b><small>台新Richart卡友 核卡消費即享</small></span></button>'+
    '<button class="opt" data-act="level" data-v="2" aria-pressed="'+(state.level===2)+'"><span><b>LEVEL 2　最高 3.8%（Chill刷 3.3%–10%）</b><small>有設定台新帳戶扣繳台新信用卡帳款 次期帳單結帳後消費享</small></span></button>'+
    '</div></div>';
  h+='<div class="set-group"><div class="set-label">卡面光澤</div>'+
    '<button class="opt" data-act="tilt" aria-pressed="'+state.tilt+'" style="width:100%"><span><b>'+(state.tilt?'已啟用手機傾斜光澤':'啟用手機傾斜光澤')+'</b><small>'+(reduce?'系統已開啟「減少動態效果」，光澤固定不動':'傾斜手機時卡面反光跟著移動；iPhone 需允許「動作與方向」')+'</small></span></button></div>';
  var mp=state.main?plan(state.main):null;
  h+='<div class="set-group"><div class="set-label">今日主卡</div><div class="panel" style="padding:4px 12px">'+
    '<button class="list-btn" data-act="pickmain">'+(mp?'<span class="swatch" style="--g:'+mp.g+'"></span>':'')+'<span class="lb-main"><b>'+(mp?esc(mp.name):'尚未設定')+'</b><div class="lb-sub">點此更換</div></span></button></div></div>';
  h+='<div class="set-group"><div class="set-label">收藏</div><div class="panel" style="padding:4px 12px">'+
    '<button class="list-btn" data-act="clearfavs"'+(state.favs.length?'':' disabled')+'><span class="lb-main"><b>清除全部收藏</b><div class="lb-sub">目前 '+state.favs.length+' 家</div></span></button></div></div>';
  h+='<div class="set-group"><div class="set-label">資料</div><p class="hint">內容依台新銀行 Richart卡活動頁原文整理，擷取日期 '+FETCHED+'。實際回饋以台新銀行公告為準。<br><a href="'+SRC+'" target="_blank" rel="noopener">開啟官方活動頁</a></p></div>';
  $('#sheetBody').innerHTML=h;
}
function renderPick(){
  var h=sheetHead('選擇今日主卡')+'<p class="hint">選擇今天在 Richart Life App 切換的方案</p><div style="margin-top:8px">';
  PLANS.forEach(function(p){
    var on=state.main===p.id;
    h+='<button class="list-btn" data-act="setmain" data-pid="'+p.id+'" aria-pressed="'+on+'"><span class="swatch" style="--g:'+p.g+'"></span><span class="lb-main"><b>'+esc(p.name)+'</b><div class="lb-sub">'+esc(p.tagline)+'</div></span><span class="num" style="font-weight:700">'+fmt(maxOf(p))+'%</span>'+(on?icon('check','check'):'')+'</button>';
  });
  if(state.main) h+='<button class="list-btn" data-act="setmain" data-pid=""><span class="lb-main"><b>清除今日主卡</b></span></button>';
  $('#sheetBody').innerHTML=h+'</div>';
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.getAttribute('data-act'),pid=el.getAttribute('data-pid');
  switch(a){
    case 'tab': setTab(el.getAttribute('data-tab'));break;
    case 'cat': setCat(el.getAttribute('data-cat'));break;
    case 'quick': setQuery(el.getAttribute('data-q'));break;
    case 'clearq': setQuery('');$('#q').focus();break;
    case 'fav': toggleFav(el.getAttribute('data-item'));break;
    case 'wcard': walletTap(pid);break;
    case 'hcard':
      if(pid===state.hview||!state.hview) openSheet('pick');
      else railGo($('#homeRail'),pidIndex(pid),true);
      break;
    case 'ccard':
      if(pid===state.open){state.flip=!state.flip;syncWallet();}
      else railGo($('#walletRail'),pidIndex(pid),true);
      break;
    case 'wmode':
      state.wmode=el.getAttribute('data-v');store.set('wmode',state.wmode);state.flip=false;
      renderWallet();window.scrollTo(0,0);break;
    case 'pickmain': if(sheetMode==='settings'){sheetMode='pick';renderPick();}else openSheet('pick');break;
    case 'setmain':
      state.main=pid||null;store.set('main',state.main);state.hview=null;
      if(sheetMode) closeSheet();
      toast(pid?'今日主卡：'+plan(pid).name:'已清除今日主卡');
      renderPage(state.tab);break;
    case 'viewplan': state.open=pid;state.flip=true;setTab('wallet');setTimeout(syncWallet,30);break;
    case 'settings': openSheet('settings');break;
    case 'close': closeSheet();break;
    case 'theme': state.theme=el.getAttribute('data-v');store.set('theme',state.theme);if(state.theme==='auto')requestGeo(true);applyTheme();renderSettings();break;
    case 'level': state.level=+el.getAttribute('data-v');store.set('level',state.level);renderSettings();renderPage(state.tab);break;
    case 'tilt':
      if(state.tilt){disableTilt();state.tilt=false;store.set('tilt',false);renderSettings();toast('已關閉傾斜光澤');}
      else enableTilt(true).then(function(ok){state.tilt=ok;store.set('tilt',ok);if(sheetMode==='settings')renderSettings();toast(ok?'已啟用傾斜光澤':'無法啟用：裝置不支援或未允許');});
      break;
    case 'qfav':
      var qq=el.getAttribute('data-q'),qi=state.qfavs.indexOf(qq);
      if(qi>-1)state.qfavs.splice(qi,1);else state.qfavs.unshift(qq);
      store.set('qfavs',state.qfavs);toast(qi>-1?'已取消收藏搜尋':'已收藏搜尋「'+qq+'」');renderPage(state.tab);break;
    case 'unqfav':
      state.qfavs=state.qfavs.filter(function(x){return x!==el.getAttribute('data-q');});
      store.set('qfavs',state.qfavs);renderPage(state.tab);break;
    case 'fxretry': loadFx(true);break;
    case 'clearfavs': state.favs=[];store.set('favs',[]);renderSettings();toast('已清除收藏');if(state.tab!=='home')renderPage(state.tab);break;
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&sheetMode){closeSheet();return;}
  var el=ev.target;
  if((ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&el.closest&&el.closest('.rail')){
    var rl=el.closest('.rail'),n=railIndex(rl)+(ev.key==='ArrowRight'?1:-1);
    if(n>=0&&n<PLANS.length){ev.preventDefault();railGo(rl,n,true);var cd=$$('.card',rl)[n];if(cd)cd.focus({preventScroll:true});}
    return;
  }
  if((ev.key==='Enter'||ev.key===' ')&&el.getAttribute&&el.getAttribute('role')==='button'){ev.preventDefault();el.click();}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('amt-in')){
    state.amt=t.value;
    $$('.amt-in').forEach(function(x){if(x!==t)x.value=t.value;});
    if(state.tab==='calc') renderCalcBody(); else updateAmts();
  }else if(t.id==='cq'){
    clearTimeout(cqT);cqT=setTimeout(function(){state.cq=t.value;renderCalcBody();},120);
  }
});
var cqT=null;
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('cur-in')){
    state.cur=t.value;store.set('cur',state.cur);
    $$('.cur-in').forEach(function(x){x.value=state.cur;});
    loadFx(false);refreshCalc();
  }else if(t.id==='ccat'){state.ccat=t.value;renderCalcBody();}
});
var qT=null;
$('#q').addEventListener('input',function(e){
  var v=e.target.value;$('#btnClear').hidden=!v;
  clearTimeout(qT);qT=setTimeout(function(){state.q=v;if(state.tab!=='search')setTab('search');else renderSearch();},120);
});
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter')e.target.blur();});

/* ---------- 初始化 ---------- */
$('#btnSettings').innerHTML=icon('sliders');
$('#searchIcon').outerHTML=icon('search');
$('#btnClear').innerHTML=icon('close');
var header=$('#header');
function setHeaderH(){document.documentElement.style.setProperty('--header-h',header.offsetHeight+'px');}
setHeaderH();
if(window.ResizeObserver) new ResizeObserver(setHeaderH).observe(header); else window.addEventListener('resize',setHeaderH);
applyTheme();
if(state.theme==='auto') requestGeo(false);
setInterval(applyTheme,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)applyTheme();});
if(state.tilt){
  enableTilt(false).then(function(ok){
    if(!ok&&typeof (window.DeviceOrientationEvent||{}).requestPermission==='function'){
      document.addEventListener('click',function once(){document.removeEventListener('click',once,true);enableTilt(true);},true);
    }
  });
}
if(state.cur!=='TWD') loadFx(false);
renderChips();renderTabbar();setTab('home');
})();
</script>
</body>
</html>
